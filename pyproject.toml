[project]
name = "managers-suite"
version = "0.1.0"
description = "Manager dashboard, roster, performance reporting and alerts"
requires-python = ">=3.11"
dependencies = ["Django>=5.0,<5.2", "openpyxl>=3.1,<4", "ortools>=9.10,<10", "reportlab>=4.2,<5", "waitress>=3,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-django>=4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "config*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
